[package]
name = "grok-harness"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Local Grok tool harness as MCP for ChatGPT Web. No model."
publish = false

[[bin]]
name = "grok-harness"
path = "src/main.rs"

[dependencies]
dirs = { workspace = true }
dunce = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "net",
    "sync",
] }
xai-grok-tools = { path = "../xai-grok-tools" }

[lints]
workspace = true
