[package]
name = "hands"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Unofficial ChatGPT plugin: local coding tools over MCP. No model."
publish = false

[lib]
name = "hands"
path = "src/lib.rs"

[[bin]]
name = "hands"
path = "src/main.rs"
[dependencies]
dirs = { workspace = true }
dunce = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "net",
    "sync",
] }
xai-grok-tools = { path = "../xai-grok-tools" }
xai-tool-types = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
[lints]
workspace = true
