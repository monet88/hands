name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: xai-org/grok-build
          ref: 9684fa3cdbf2995e30ea8b9b637f1db008f144fc
          path: .grok-build

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Inject crate (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/inject.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.grok-build"

      - name: Inject crate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/inject.py $env:GITHUB_WORKSPACE "$env:GITHUB_WORKSPACE/.grok-build"

      - name: Build
        working-directory: .grok-build
        run: cargo build --release -p hands

      - name: Smoke (Unix)
        if: runner.os != 'Windows'
        run: |
          bin=".grok-build/target/release/hands"
          "$bin" --version
          "$bin" --help
          "$bin" status --json
          tmp="$(mktemp -d)"
          echo hello > "$tmp/n.txt"
          "$bin" use "$tmp"
          "$bin" call read_file '{"target_file":"n.txt"}' | grep -q hello

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = ".grok-build/target/release/hands.exe"
          & $bin --version
          & $bin --help
          & $bin status --json
          $tmp = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "hands-smoke-test")
          Set-Content -Path (Join-Path $tmp.FullName "n.txt") -Value "hello"
          & $bin use $tmp.FullName
          $out = & $bin call read_file '{"target_file":"n.txt"}'
          if ($out -notmatch "hello") {
            Write-Error "smoke test failed: $out"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hands-${{ runner.os }}-${{ runner.arch }}
          path: |
            .grok-build/target/release/hands
            .grok-build/target/release/hands.exe
          if-no-files-found: error
